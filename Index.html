<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Maurice">
    <title>Bakery Home Page</title>
    <link rel="stylesheet" href="Home-Page-stylesheet.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <span id="wordmark">Carmen <strong>The Baker</strong></span>

        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#menu">Menu</a></li>
                <li><a href="#about">About Us</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>

        <button id="call-button">Call Now</button>
    </header>

    <main>

        <section id="hero">
            <div class="hero-content">
                <h1>Carmen's Bakery</h1>
                <p>Freshly crafted treats for every celebration</p>
                <button id="hero-button">Explore Our Menu</button>
            </div>
        </section>
        
        <section id="featured-products">
            

            <div class="featured-product-wrapper">
                <a href="">
                <img src="images/cake-with-pink-background.jpg" alt="First featured product">
            </a> 

            <span>Cherry Cake</span>
            </div>

             <div class="featured-product-wrapper">
                <a href="">
                <img src="images/cake-with-pink-background.jpg" alt="Second featured product">
            </a> 

            <span>Blue Cake</span>
            </div>

             <div class="featured-product-wrapper">
                <a href="">
                <img src="images/cake-with-pink-background.jpg" alt="Third featured product">
            </a> 

            <span>Green Cake</span>
            </div>
        </section>
    </main>

    <footer id="global-footer">
        <span>+1 206 555 0100</span>
        <span>Location: Crown Point, IN</span>
        <span>Hours: xx:xx-xx:xx</span>
        <a href="">Facebook</a>
    </footer>
</body>
</html>
